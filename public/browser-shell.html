<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>DeepSeek</title>
    <style>
      :root {
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        --shell-bg:
          radial-gradient(circle at top, rgba(37, 99, 235, 0.18), transparent 32%),
          linear-gradient(180deg, #091120 0%, #0f172a 100%);
        --shell-status-bg: rgba(15, 23, 42, 0.76);
        --shell-status-text: #e2e8f0;
        --shell-mask-bg:
          radial-gradient(circle at top, rgba(37, 99, 235, 0.18), transparent 32%),
          linear-gradient(180deg, #091120 0%, #0f172a 100%);
        --shell-title-color: #e2e8f0;
        --shell-logo-shadow: drop-shadow(0 10px 20px rgba(37, 99, 235, 0.2));
        background: #0f172a;
        color-scheme: dark;
      }

      :root[data-theme='light'] {
        --shell-bg:
          radial-gradient(circle at top, rgba(14, 165, 233, 0.12), transparent 34%),
          linear-gradient(180deg, #f8fbff 0%, #eef5ff 46%, #e8f0fb 100%);
        --shell-status-bg: rgba(255, 255, 255, 0.82);
        --shell-status-text: #0f172a;
        --shell-mask-bg:
          radial-gradient(circle at top, rgba(14, 165, 233, 0.12), transparent 34%),
          linear-gradient(180deg, #f8fbff 0%, #eef5ff 46%, #e8f0fb 100%);
        --shell-title-color: #0f172a;
        --shell-logo-shadow: drop-shadow(0 10px 20px rgba(14, 165, 233, 0.18));
        background: #eef5ff;
        color-scheme: light;
      }

      :root[data-theme='dark'] {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--shell-bg);
      }

      .shell {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #deepseek-webview {
        width: 100%;
        height: 100%;
        border: 0;
        opacity: 1;
        transition: opacity 180ms ease;
      }

      #deepseek-webview.is-hidden {
        opacity: 0;
      }

      .shell-status {
        position: absolute;
        left: 50%;
        bottom: 24px;
        transform: translateX(-50%);
        padding: 10px 14px;
        border-radius: 999px;
        background: var(--shell-status-bg);
        color: var(--shell-status-text);
        font-size: 13px;
        backdrop-filter: blur(10px);
        pointer-events: none;
        z-index: 2;
        transition: opacity 160ms ease, visibility 160ms ease;
      }

      .shell-status.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .shell-mask {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background: var(--shell-mask-bg);
        z-index: 1;
        transition: opacity 180ms ease, visibility 180ms ease;
      }

      .shell-mask.is-hidden {
        opacity: 0;
        visibility: hidden;
      }

      .shell-mask__content {
        display: grid;
        gap: 14px;
        justify-items: center;
      }

      .shell-mask__logo {
        width: 72px;
        height: 72px;
        object-fit: contain;
        filter: var(--shell-logo-shadow);
      }

      .shell-mask__title {
        color: var(--shell-title-color);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <webview
        id="deepseek-webview"
        class="is-hidden"
      ></webview>
      <div
        id="deepseek-mask"
        class="shell-mask"
      >
        <div class="shell-mask__content">
          <img
            class="shell-mask__logo"
            src="./logo.png"
            alt="DeepSeek"
          />
          <div class="shell-mask__title">DeepSeek</div>
        </div>
      </div>
      <div
        id="deepseek-status"
        class="shell-status"
      >
        正在准备 DeepSeek 窗口...
      </div>
    </main>
  </body>
</html>
