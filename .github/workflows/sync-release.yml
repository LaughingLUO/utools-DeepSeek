# .github/workflows/sync-release.yml
name: Sync Release to Gitee

on:
  release:
    types: [published]  # 当你在GitHub上发布新Release时触发[reference:4]
  workflow_dispatch:    # 允许你在Actions页面手动触发[reference:5]
    inputs:
      tag:
        description: '要手动同步的GitHub Release标签 (例如 v1.0.0)'
        required: false
        default: ''

jobs:
  sync-release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync Release to Gitee
        uses: ffishh/release-sync@v1  # 使用ReleaseSync Action[reference:6]
        with:
          gitee-token: ${{ secrets.GITEE_TOKEN }}
          # 如果你的Gitee用户名和GitHub不同，可以在这里指定
          gitee-owner: 'LaughingLUO'